# Run configuration. No secrets here: OPENROUTER_API_KEY lives in .env.

[extraction]
prompt = "extract"
prompt_version = "v1"
max_input_tokens = 20000   # whole pages up to this estimate (S1-03)
repair_prompt = "repair"   # an invalid reply gets one repair attempt with this prompt (S1-15)
repair_prompt_version = "v1"

[budget]
stop_at_usd = 10.0         # stop before the next call once all results/ together cost this (raised from 4.0 in S1-22)

# What plain `make run-extraction` runs (S1-17): every model x prompt version, and for a model that takes
# sampling (Ollama models, haiku-4.5) every sampling configuration too; haiku-5.5 takes none
# (docs/ISSUES.md I-003). Then docs/reports/stage-1.md is rebuilt.
[comparison]
models = ["haiku-5.5", "haiku-4.5", "qwen3.5-9b"]
prompt_versions = ["v1", "v2", "v3"]
sampling = ["default", "greedy"]

[openrouter]
base_url = "https://openrouter.ai/api/v1"
timeout_s = 60
max_retries = 3
backoff_s = 2.0            # waits 2, 4, 8 s

[ollama]
base_url = "http://localhost:11434"
timeout_s = 900            # CPU-only prompt processing can take minutes
max_retries = 1
backoff_s = 5.0

# No temperature/top_p (docs/ISSUES.md I-003). Prices: GET /api/v1/models, under 100k prompt
# tokens; used by the metrics script for cost per 1000 documents (docs/METRICS.md).
[models."haiku-5.5"]
client = "openrouter"
slug = "anthropic/claude-haiku-5.5"
reasoning_effort = "none"
max_tokens = 8000
price_in_usd_per_mtok = 0.10
price_out_usd_per_mtok = 0.50
price_checked = 2026-10-21

# Added in S1-22 as a cloud model that takes sampling. Claude 4+ models reject temperature and
# top_p in one request, so only temperature is sent: 1.0 (`default`, also the API default) or
# 0.0 (`greedy`). No reasoning_effort: OpenRouter does not list it for this model. Price checked
# on GET /api/v1/models; 200K context.
[models."haiku-4.5"]
client = "openrouter"
slug = "anthropic/claude-haiku-4.5"
max_tokens = 8000
sampling = "default"
sampling_params = ["temperature"]
price_in_usd_per_mtok = 1.00
price_out_usd_per_mtok = 5.00
price_checked = 2026-10-28

# Local models: sized for a 32 GB laptop, CPU only. Default Ollama tags; on an
# Apple Silicon Mac they resolve to nvfp4 builds run by the MLX runner (docs/ISSUES.md I-004).
# num_ctx must hold the longest prompt (D003, about 50k tokens) plus num_predict.
# `sampling` names the [sampling] table used when --sampling is not given.
[models."gemma4-e4b"]
client = "ollama"
slug = "gemma4:e4b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

[models."gemma4-12b"]
client = "ollama"
slug = "gemma4:12b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

[models."qwen3.5-9b"]
client = "ollama"
slug = "qwen3.5:9b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

# Sampling configurations (S1-10). Ollama models get both values; haiku-4.5 gets only the ones
# in its sampling_params (S1-22); haiku-5.5 takes none (docs/ISSUES.md I-003). Other Modelfile
# options (qwen3.5:9b: top_k 20, presence_penalty 1.5) stay at the model's defaults.
[sampling."default"]       # = qwen3.5:9b Modelfile values, what the S1-09 bake-off ran at
temperature = 1.0
top_p = 0.95

[sampling."greedy"]        # deterministic: always the most likely token
temperature = 0.0
top_p = 1.0

# Embeddings (S2-06): models run in-process with FastEmbed (decision 13); downloads go to
# cache_dir (gitignored). FastEmbed adds no query/passage prefixes itself, so the prefixes each
# model card asks for are set below. `compare` = every multilingual text model FastEmbed 0.9.1
# lists, except jinaai/jina-embeddings-v3 (CC BY-NC 4.0 licence) and the full-precision
# Qwen3-Embedding-0.6B (the same model as the int8 one, twice the size).
[embedding]
model = "embeddinggemma"   # picked by the user after `make compare-embeddings`, S2-06 (2026-11-19)
compare = ["minilm-l12", "mpnet-base", "potion-128m", "e5-large", "embeddinggemma", "qwen3-0.6b-q"]
batch_size = 32
cache_dir = ".cache/fastembed"

[embedding_models."minilm-l12"]
name = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

[embedding_models."mpnet-base"]
name = "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"

[embedding_models."potion-128m"]   # static: a lookup table of word vectors, no transformer
name = "minishlab/potion-multilingual-128M"

[embedding_models."e5-large"]
name = "intfloat/multilingual-e5-large"
query_prefix = "query: "
passage_prefix = "passage: "

[embedding_models."embeddinggemma"]
name = "google/embeddinggemma-300m"
query_prefix = "task: search result | query: "
passage_prefix = "title: none | text: "

[embedding_models."qwen3-0.6b-q"]
name = "Qwen/Qwen3-Embedding-0.6B-Q"
query_prefix = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"

# Vector index (S2-06): Qdrant in local mode, one collection per chunking strategy (user's
# choice), rebuilt from the chunk files by `make index`.
[index]
path = "data/index/qdrant"
collections = { structure = "data/chunks/chunks.jsonl", fixed = "data/chunks/chunks_fixed.jsonl" }

# Retrieval (S2-07): BM25 keyword search next to vector search, merged by reciprocal rank
# fusion (RRF). k1 1.2 and b 0.75 are the usual BM25 defaults and rrf_k 60 the constant of the
# original RRF paper (Cormack et al., 2009); none of them is tuned. k1 and b are applied when
# `make index` builds the BM25 vectors, so changing them needs a rebuild.
[search]
mode = "hybrid"      # vector | bm25 | hybrid, for `make search` without MODE
rerank = true        # whether `make search` reranks without RERANK (S2-08). On since S2-10: the
                     # default rule picked hybrid+rerank on the gold set (evals/results/retrieval.md)
prefetch_k = 50      # candidates from each retriever before fusion
rrf_k = 60
bm25_k1 = 1.2
bm25_b = 0.75

# Reranking (S2-08): a cross-encoder reads the query and one candidate chunk together and
# scores how well the chunk answers it; it reorders the first `candidates` hits of the first
# stage (vector, BM25 or hybrid). Runs in-process with FastEmbed, models in [embedding]
# cache_dir. `compare` = the multilingual cross-encoders FastEmbed 0.9.1 lists, except
# jinaai/jina-reranker-v2-base-multilingual (CC BY-NC 4.0 licence); the others are English-only.
# candidates 30 is a starting value, not tuned.
[reranking]
model = "bge-m3-int8"   # picked by the user after `make compare-rerankers`, S2-08 (2026-11-20)
compare = ["bge-m3", "bge-m3-int8"]
candidates = 30
batch_size = 8

[reranker_models."bge-m3"]
name = "BAAI/bge-reranker-v2-m3"

[reranker_models."bge-m3-int8"]   # the same model with INT8 weights: a quarter of the size
name = "BAAI/bge-reranker-v2-m3-int8"

# Retrieval measurement (S2-10): `make eval-retrieval` runs every setup on every collection in
# [index] for the questions in evals/retrieval_gold.toml, and reports recall@k for each k and
# MRR over the top max(ks). A setup is vector, bm25 or hybrid, with "+rerank" for the [reranking]
# model on top. Nothing here is tuned on the gold set (docs/METRICS.md).
[retrieval_eval]
ks = [1, 3, 5, 10]
setups = ["vector", "bm25", "hybrid", "hybrid+rerank"]

# Answer pipeline (S2-13): `make ask Q=...` searches `collection` with the [search] settings
# (hybrid + rerank), offers the best k hits to the context in rank order and stops at the first
# that would take the context over max_context_tokens (estimated at 4 characters per token, which
# undercounts Cyrillic; the real prompt tokens are logged). The model answers with the [answer]
# prompt; an answer whose citations fail the checks gets one repair attempt with repair_prompt.
# k and max_context_tokens are starting values, not tuned (user's choice, 2026-11-21).
# stop_at_usd is the stage 2 budget guard (decision 18): the cost of every file in
# results/answers/, apart from the stage 1 guard in [budget].
[answer]
model = "haiku-5.5"            # decision 15
prompt = "answer"
prompt_version = "v2"          # S2-14, user's choice (prompts/CHANGELOG.md)
repair_prompt = "answer_repair"
repair_prompt_version = "v1"
collection = "structure"       # decision 19
k = 10
max_context_tokens = 4000
stop_at_usd = 5.0
# S2-14 "I don't know": refuse without a model call when the best hit's reranker score (raw
# bge-reranker-v2-m3 score, higher is better) is below this. Leave it out for no gate. Picked
# by `make eval-refusal` on the development questions (evals/dev_questions.toml) with the rule
# in docs/METRICS.md (user's choice, 2026-11-21); known risk in docs/ISSUES.md I-010.
min_rerank_score = -1.03

# "I don't know" measurement (S2-14): `make eval-refusal` answers every question in
# evals/dev_questions.toml with each of these versions of the [answer] prompt, with the score
# gate off, and picks the gate threshold by the rule in docs/METRICS.md.
[refusal_eval]
prompt_versions = ["v1", "v2"]
