# Run configuration. No secrets here: OPENROUTER_API_KEY lives in .env.

[extraction]
prompt = "extract"
prompt_version = "v1"
max_input_tokens = 20000   # whole pages up to this estimate (S1-03)
repair_prompt = "repair"   # an invalid reply gets one repair attempt with this prompt (S1-15)
repair_prompt_version = "v1"

[budget]
stop_at_usd = 4.0          # stop before the next call once all results/ together cost this (course budget $5)

# What plain `make run` runs (S1-17): every model x prompt version, and for a local model every
# sampling configuration too (the cloud model takes none, decision 11). Then REPORT.md is rebuilt.
[comparison]
models = ["haiku-5.5", "qwen3.5-9b"]
prompt_versions = ["v1", "v2", "v3"]
sampling = ["default", "greedy"]

[openrouter]
base_url = "https://openrouter.ai/api/v1"
timeout_s = 60
max_retries = 3
backoff_s = 2.0            # waits 2, 4, 8 s

[ollama]
base_url = "http://localhost:11434"
timeout_s = 900            # CPU-only prompt processing can take minutes
max_retries = 1
backoff_s = 5.0

# No temperature/top_p (docs/ISSUES.md I-003). Prices: GET /api/v1/models, under 100k prompt
# tokens; used by the metrics script for cost per 1000 documents (docs/METRICS.md).
[models."haiku-5.5"]
client = "openrouter"
slug = "anthropic/claude-haiku-5.5"
reasoning_effort = "none"
max_tokens = 8000
price_in_usd_per_mtok = 0.10
price_out_usd_per_mtok = 0.50
price_checked = 2026-10-21

# Local models (decision 3b): sized for a 32 GB laptop, CPU only. Default Ollama tags; on an
# Apple Silicon Mac they resolve to nvfp4 builds run by the MLX runner (docs/ISSUES.md I-004).
# num_ctx must hold the longest prompt (D003, about 50k tokens) plus num_predict.
# `sampling` names the [sampling] table used when --sampling is not given.
[models."gemma4-e4b"]
client = "ollama"
slug = "gemma4:e4b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

[models."gemma4-12b"]
client = "ollama"
slug = "gemma4:12b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

[models."qwen3.5-9b"]
client = "ollama"
slug = "qwen3.5:9b"
num_ctx = 65536
num_predict = 4000
think = false
sampling = "default"

# Sampling configurations (S1-10). Local (Ollama) models only: the cloud model does not accept
# temperature/top_p (decision 11, docs/ISSUES.md I-003). Other Modelfile options (qwen3.5:9b:
# top_k 20, presence_penalty 1.5) stay at the model's defaults.
[sampling."default"]       # = qwen3.5:9b Modelfile values, what the S1-09 bake-off ran at
temperature = 1.0
top_p = 0.95

[sampling."greedy"]        # deterministic: always the most likely token
temperature = 0.0
top_p = 1.0
