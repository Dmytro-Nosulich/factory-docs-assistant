# Retrieval gold set (S2-09, decision 16).
# Questions and evidence are written by hand by the user.
# Used by S2-10 (`make eval-retrieval`) to measure recall@k and MRR.
#
# One [[question]] block per question, followed by one or more
# [[question.evidence]] blocks: places in the corpus that answer it.
#
# [[question]]
#   id        "R01", "R02", ... unique, never reused.
#   question  The question as a user would type it.
#   language  Language of the question (en, de, uk, ...). It may differ
#             from the document's language (a cross-language question).
#   notes     Optional. Why this question is interesting, e.g. "CAS lookup".
#
# [[question.evidence]]
#   doc_id    Document ID from data/manifest.csv, e.g. "D001".
#   section   The heading the quote sits under, copied from the document.
#   page      PDF page number (1-based). Leave the line out for HTML, DOCX
#             and Markdown documents, which have no pages.
#   quote     A short exact copy of the answering text: a phrase or one
#             sentence, from a single paragraph or table cell. Line breaks
#             and extra spaces do not matter; everything else must match.
#             Write it in single quotes ('...'), so nothing needs escaping.
#             If the quote itself contains ', use triple quotes ('''...''').
#
# Scoring rule: a retrieved chunk is a hit when it comes from the evidence's
# doc_id AND contains its quote. If a question has several evidence blocks,
# any one of them counts (they are alternative sources for the same answer).

[[question]]
id = "R01"
question = "What can happen to nitrogen gas cylinders in a fire?"
language = "en"
notes = "Example written by Claude at the user's request (2026-11-20). The same sentence is also in the argon SDS D039, so only a D001 chunk counts."

[[question.evidence]]
doc_id = "D001"
section = "SECTION 5: Firefighting measures"
page = 4
quote = 'Heat may cause the containers to explode.'

