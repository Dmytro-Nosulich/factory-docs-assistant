# Test set for the stage 2 RAG pipeline (S2-16).
# Drafted by Claude at the user's request (2026-11-23) and reviewed by the user.
# Checked by `make test-set-check`.
#
# TEST ONLY. Nothing is tuned on these questions: no threshold, prompt, search setting or
# chunking choice may be changed because of a result on them. No question repeats one of
# evals/dev_questions.toml (tuning) or evals/retrieval_gold.toml (search default); the check
# enforces that. Their facts were also picked apart from those two files.
#
# One [[question]] block per question.
#
# [[question]]
#   id               "T01", "T02", ... unique, never reused.
#   question         The question as a user would type it.
#   language         Language of the question (en, de, uk, ...).
#   category         answerable        the corpus answers it.
#                    similar_doc       a sibling document holds a similar fact; citing it is wrong.
#                    outdated_version  the fact changed between versions; the current one is right,
#                                      citing the superseded one is wrong.
#                    unanswerable      no document states it; the expected status is
#                                      not_in_documents (near misses and off-topic questions).
#   expected_answer  Short reference answer in English.
#   notes            Why the question is here, and an English translation for other languages.
#   key_facts        Facts a correct answer contains. Each fact is a list of accepted spellings
#                    (one is enough); at least one spelling is in an evidence quote. Not for
#                    unanswerable questions.
#   forbidden_facts  Traps only, optional: the sibling's or the old version's value. An answer
#                    that contains one fell into the trap. Found in a wrong doc, in no quote.
#   wrong_docs       Traps only: documents whose citation is wrong. For outdated_version, each is
#                    superseded by an evidence document (data/manifest.csv `supersedes`).
#   absent_terms     Unanswerable only, optional: terms that no chunk of any collection contains.
#
# [[question.evidence]] (all but unanswerable): the same format and rules as in
# evals/retrieval_gold.toml (doc_id, section, page for PDFs only, quote). Several blocks are
# alternatives; any one answers the question.

# --- answerable -------------------------------------------------------------------------

