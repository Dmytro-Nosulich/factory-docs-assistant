# Development questions for "I don't know" (S2-14).
# Drafted by Claude at the user's request (2026-11-21) and reviewed by the user.
# Checked by `make dev-questions-check`.
#
# DEV ONLY. The refusal threshold and the answer prompt versions are tuned on these
# questions, so they must never be reused in the test set (S2-16). Their texts must also
# differ from the retrieval gold set (evals/retrieval_gold.toml); the check enforces that.
#
# One [[question]] block per question.
#
# [[question]]
#   id        "V01", "V02", ... unique, never reused.
#   question  The question as a user would type it.
#   language  Language of the question (en, de, uk, ...).
#   kind      answerable  the corpus answers it; give [[question.evidence]].
#             near_miss   on the corpus's topics, but no document states the fact (another
#                         substance, a sibling product, a property no document gives).
#             off_topic   nothing in the corpus is about it.
#   notes     Why the question is here, and an English translation for other languages.
#
# [[question.evidence]] (answerable only): the same format and rules as in
# evals/retrieval_gold.toml (doc_id, section, page for PDFs only, quote).
#
# Absence of the near-miss facts was checked by searching all chunks for the substance or
# product name (helium, hydrogen / UN 1049, HLP 68, OTTOSEAL S 110, Proline 300 PROFINET)
# and, for V14 and V15, for price and shelf-life words; none was found (2026-11-21).

# --- answerable -------------------------------------------------------------------------

[[question]]
id = "V01"
question = "What is the flash point of LIQUI MOLY Hydraulikoel HLP 46?"
language = "en"
kind = "answerable"
notes = "Property lookup in an English SDS. Sibling trap V11 asks the same for HLP 68."

[[question.evidence]]
doc_id = "D050"
section = "SECTION 9: Physical and chemical properties"
page = 6
quote = 'Flash point: 243 °C (ISO 2592 (Cleveland, open cup))'

