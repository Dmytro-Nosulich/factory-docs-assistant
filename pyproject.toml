[project]
name = "factory-docs"
version = "0.1.0"
description = "Structured extraction, RAG and agents over open industrial documentation."
authors = [
    { name = "Dmytro Nosulich", email = "dmytro.nosulich@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
